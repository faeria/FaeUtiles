name: Release Cortex

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "release/**"
  create:

permissions:
  contents: write

concurrency:
  group: release-cortex-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-package-release:
    if: github.event_name == 'push' || (github.event_name == 'create' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == release/* ]]; then
            version="${GITHUB_REF_NAME#release/}"
            version="${version#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 zip

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)
          test ${#files[@]} -gt 0
          for file in "${files[@]}"; do
            echo "Checking $file"
            luac5.1 -p "$file"
          done

      - name: Validate TOC and package file list
        shell: bash
        run: |
          set -euo pipefail
          toc="FaeUtiles.toc"
          grep -Fxq "## Version: ${VERSION}" "$toc"
          grep -Fxq '## Interface: 120100' "$toc"
          awk '
            {
              sub(/\r$/, "")
            }
            /^[[:space:]]*$/ || /^[[:space:]]*#/ {
              next
            }
            {
              gsub(/\\/, "/")
              sub(/^[[:space:]]+/, "")
              sub(/[[:space:]]+$/, "")
              print
            }
          ' "$toc" > /tmp/toc-files.txt
          test -s /tmp/toc-files.txt
          duplicates="$(sort /tmp/toc-files.txt | uniq -d)"
          test -z "$duplicates" || { echo "Duplicate TOC entries:"; echo "$duplicates"; exit 1; }
          while IFS= read -r file; do
            case "$file" in
              /*|../*|*/../*|*/..)
                echo "Unsafe TOC path: $file"
                exit 1
                ;;
            esac
            test -f "$file" || { echo "Missing TOC file: $file"; exit 1; }
          done < /tmp/toc-files.txt
          test -f Bindings.xml || { echo "Missing WoW special file: Bindings.xml"; exit 1; }

      - name: Build WowUp-compatible ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/FaeUtiles
          cp -p FaeUtiles.toc package/FaeUtiles/FaeUtiles.toc
          cp -p Bindings.xml package/FaeUtiles/Bindings.xml
          while IFS= read -r file; do
            mkdir -p "package/FaeUtiles/$(dirname "$file")"
            cp -p "$file" "package/FaeUtiles/$file"
          done < /tmp/toc-files.txt
          if [[ -d TexturesGUI ]]; then
            find TexturesGUI -type f -print0 | while IFS= read -r -d '' file; do
              mkdir -p "package/FaeUtiles/$(dirname "$file")"
              cp -p "$file" "package/FaeUtiles/$file"
            done
          fi
          (cd package && zip -qr "../FaeUtiles-${VERSION}.zip" FaeUtiles)

      - name: Validate WowUp ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PWD/FaeUtiles-${VERSION}.zip" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              names = [name for name in archive.namelist() if name]

          roots = {name.split('/', 1)[0] for name in names}
          if roots != {"FaeUtiles"}:
              raise SystemExit(f"Invalid ZIP root folders: {sorted(roots)}")

          required = {
              "FaeUtiles/FaeUtiles.toc",
              "FaeUtiles/Bindings.xml",
          }
          with open("/tmp/toc-files.txt", encoding="utf-8") as toc_files:
              required.update(
                  f"FaeUtiles/{line.strip()}"
                  for line in toc_files
                  if line.strip()
              )
          missing = sorted(required.difference(names))
          if missing:
              raise SystemExit(f"Required package files are missing: {missing}")

          forbidden = {
              "FaeUtiles/AGENTS.md",
              "FaeUtiles/README.md",
              "FaeUtiles/CHANGELOG.md",
          }
          found_forbidden = sorted(forbidden.intersection(names))
          if found_forbidden:
              raise SystemExit(
                  f"Forbidden documentation files in release ZIP: {found_forbidden}"
              )

          wrappers = sorted(
              name for name in names
              if name.startswith("FaeUtiles-")
          )
          if wrappers:
              raise SystemExit(f"Release wrapper folder/files found in ZIP: {wrappers}")

          print(f"WowUp ZIP validation OK: {path}")
          print(f"Entries: {len(names)}")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Cortex ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          files: FaeUtiles-${{ env.VERSION }}.zip
          fail_on_unmatched_files: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

      - name: Remove temporary release branch
        if: startsWith(github.ref_name, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="heads/${GITHUB_REF_NAME}"
          if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
          else
            echo "Release branch already removed: ${GITHUB_REF_NAME}"
          fi
